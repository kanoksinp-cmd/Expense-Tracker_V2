      ${e&&e.image_blob?`<div class="btns" style="margin-top:8px"><button type="button" class="btn sm" data-act="zoom" data-t="expenses" data-id="${e.id}">ดูรูปเต็ม</button><label class="chk" style="flex:1"><input type="checkbox" name="delimg"> ลบรูปนี้</label></div>`:""}</div>`}
   </div>
   ${ro ? "" : `<div class="sheet-f"><div class="btns">${e?`<button type="button" class="btn danger" style="flex:0 0 auto" data-act="delBill" data-id="${e.id}">ลบ</button>`:""}<button class="btn pri" type="submit">${e?"บันทึกการแก้ไข":"บันทึกบิล"}</button></div></div>`}
  </form>`;
}
function billFormList(f){
  const c = ctx(), e = f.dataset.id ? DB.expenses.find(x => x.id === num(f.dataset.id)) : null;
  return [c, e, e ? (c.members.includes(e.payer_name) ? c.members : [...c.members, e.payer_name]) : c.members];
}
function readSplit(f){
  const [c, e, list] = billFormList(f), fd = new FormData(f), mode = fd.get("mode") || "equal", split = fd.getAll("sp");
  let detail = null;
  if (mode !== "equal"){ const values = {}; list.forEach((n,i) => { const v = Number(fd.get(`v_${mode}_${i}`))||0; if (split.includes(n) && (mode==="share" || v > 0)) values[n] = v; }); detail = JSON.stringify({mode, values}); }
  return {c, e, list, fd, mode, split, detail, amt: r2(Number(fd.get("amt"))||0)};
}
function updatePreview(f){
  const ai = f.querySelector(".amt-wrap input"); if (ai) ai.style.width = Math.max(1, (ai.value||ai.placeholder).length) * 0.62 + 0.4 + "em";
  const p = f.querySelector("#preview"); if (!p) return;
  const r = readSplit(f);
  if (!(r.amt > 0) || !r.split.length){ p.innerHTML = `<span class="muted">ใส่ยอดเงินแล้วจะเห็นว่าแต่ละคนจ่ายเท่าไร</span>`; return; }
  const sh = splitAmounts(r.amt, r.split, r.detail, r.e ? r.e.id : num(f.dataset.newid));
  p.innerHTML = Object.entries(sh).map(([n,v]) => `<span>${esc(n)} <b>${fmt(v)}</b></span>`).join("");
}

/* ═══════════════ PACKING ═══════════════ */
function vPacking(c){
  const packs = DB.packing.filter(p => p.trip_id === c.tid).sort((a,b) => (a.done-b.done) || (a.id-b.id));
  let h = lockedNotice(c.closed);
  if (!c.closed) h += `<form class="panel" data-form="addPack"><div class="fld" style="margin-bottom:10px"><input type="text" name="item" placeholder="ของที่ต้องเอาไป เช่น เต็นท์ เตาแก๊ส ถ่าน" aria-label="ของที่ต้องเอาไป"></div>
    <div style="display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px"><input type="text" name="qty" placeholder="จำนวน" aria-label="จำนวน"><select name="who" aria-label="ใครรับผิดชอบ"><option value="">ใครหิ้ว?</option>${c.members.map(m => opt(m,"")).join("")}</select><button class="btn pri" type="submit" aria-label="เพิ่ม">${ic("plus")}</button></div></form>`;
  if (!packs.length) return h + emptyState("🎒","ยังไม่มีรายการของ","ใส่ของที่ต้องเอาไป แล้วแบ่งกันว่าใครหิ้วอะไร จะได้ไม่มีใครลืมเต็นท์");
  const done = packs.filter(p => p.done).length;
  h += `<div class="pk-prog"><div class="pk-bar"><div style="width:${(done/packs.length*100).toFixed(0)}%"></div></div><span class="num" style="font-weight:600">${done}/${packs.length}</span></div>
    <div class="hint" style="margin-top:-6px">ของคุณค้างอยู่ ${packs.filter(p => p.assignee===c.me && !p.done).length} ชิ้น · ยังไม่มีคนรับ ${packs.filter(p => !p.assignee).length} ชิ้น</div>`;
  const amtOf = Object.fromEntries(DB.expenses.filter(e => e.trip_id === c.tid).map(e => [e.id, e.amount]));
  const dis = c.closed ? "disabled" : "";
  h += `<div class="list">` + packs.map(p => {
    const has = p.expense_id && amtOf[p.expense_id] != null, cur = has ? amtOf[p.expense_id] : 0;
    return `<div class="pk-item ${p.done?"pk-done":""}"><div class="pk-top"><input type="checkbox" ${p.done?"checked":""} ${dis} data-change="packDone" data-id="${p.id}" aria-label="เตรียมแล้ว: ${esc(p.item)}">
      <div style="flex:1;min-width:0"><span class="pk-name" style="font-weight:600">${esc(p.item)}</span>${p.qty?` <span class="muted">${esc(p.qty)}</span>`:""}
      ${p.assignee?`<span class="pill" style="background:${personColor(p.assignee)}">${esc(p.assignee)}</span>`:`<span class="pill" style="background:var(--ink3)">ยังไม่มีคนรับ</span>`}${has?`<span class="pill" style="background:var(--pine);color:var(--on-pine)">${fmt(cur)} ฿</span>`:""}</div></div>
      <div class="pk-ctl"><select ${dis} data-change="packWho" data-id="${p.id}" aria-label="ผู้รับผิดชอบ"><option value="">ยังไม่มีคนรับ</option>${c.members.map(m => opt(m,p.assignee)).join("")}</select>
      <input type="number" min="0" step="0.01" inputmode="decimal" placeholder="ราคา" value="${cur?cur.toFixed(2):""}" ${dis} data-change="packPrice" data-id="${p.id}" aria-label="ราคา">
      <button class="btn sm danger" ${dis} data-act="packDel" data-id="${p.id}" aria-label="ลบ">ลบ</button></div></div>`; }).join("") + `</div>`;
  return h + `<div class="hint">ใส่ราคาแล้วกด Enter ระบบจะทำเป็นบิลหารกันทุกคนให้เอง ใส่ 0 เพื่อยกเลิกบิล</div>`;
}

/* ═══════════════ CAMP ═══════════════ */
function vCamp(c){
  const t = c.trip, has = t.lat != null && t.lon != null;
  let h = "";
  if (has){
    const {lat, lon} = t;
    const src = UI.mapMode === "g" ? `https://maps.google.com/maps?q=${lat},${lon}&z=15&output=embed`
      : `https://www.openstreetmap.org/export/embed.html?bbox=${lon-0.02},${lat-0.012},${lon+0.02},${lat+0.012}&layer=mapnik&marker=${lat},${lon}`;
    h += `<div class="panel" style="display:flex;align-items:center;gap:12px"><div style="font-size:28px">📍</div><div style="flex:1;min-width:0"><div style="font-family:var(--disp);font-weight:600;font-size:16px">${esc(t.place_name||"จุดกางเต็นท์")}</div><div class="muted num" style="font-size:13px">${lat.toFixed(5)}, ${lon.toFixed(5)}</div></div>
      <a class="btn pri sm" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}">นำทาง</a></div>
      <div class="seg sm"><label><input type="radio" name="mm" value="osm" ${UI.mapMode!=="g"?"checked":""} data-change="mapMode">แผนที่</label><label><input type="radio" name="mm" value="g" ${UI.mapMode==="g"?"checked":""} data-change="mapMode">Google Maps</label></div>
      <iframe class="map" src="${src}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="แผนที่จุดกางเต็นท์"></iframe>
      <h2>อากาศ 7 วัน</h2><div id="wx">${wxHtml(lat,lon)}</div>`;
  } else h += emptyState("📍","ยังไม่ได้ปักหมุดจุดกางเต็นท์","ใส่พิกัดหรือวางลิงก์ Google Maps ด้านล่าง แล้วจะได้แผนที่และพยากรณ์อากาศของที่นั่น");
  if (!c.closed) h += more("campedit", has ? "✏️ เปลี่ยนจุดกางเต็นท์" : "📍 ตั้งจุดกางเต็นท์", `<form class="panel" data-form="campLoc">
    <div class="fld"><span class="lbl">ชื่อสถานที่</span><input type="text" name="pn" value="${esc(t.place_name||"")}" placeholder="ลานกางเต็นท์ผาหล่มสัก"></div>
    <div class="fld"><span class="lbl">พิกัด หรือลิงก์ Google Maps</span><input type="text" name="co" value="${has?`${t.lat}, ${t.lon}`:""}" placeholder="18.7883, 98.9853"></div>
    <div class="btns"><button class="btn pri" type="submit">บันทึกจุดกางเต็นท์</button>${has?`<button class="btn" style="flex:0 0 auto" type="button" data-act="clearCamp">ล้าง</button>`:""}</div></form>`);
  if (has && !c.closed && !UI.open.has("campedit")) {}
  h += `<h2>ก่อนออกเดินทาง</h2><div class="panel"><div style="font-size:14px;margin-bottom:10px">ที่แคมป์มักไม่มีสัญญาณ บันทึกสรุปยอด QR และรายการของเป็นรูปเก็บไว้ในเครื่องก่อน</div><button class="btn pri full" data-act="dlOffline">${ic("dl")} บันทึกสรุปทริปเป็นรูป</button></div>`;
  return h;
}
function wxHtml(lat, lon){
  const k = `${lat},${lon}`, w = WX[k];
  if (!w || (w.t && Date.now()-w.t > 1800000 && !w.loading)) { setTimeout(() => loadWx(lat,lon)); return `<div class="panel muted">กำลังโหลดพยากรณ์อากาศ…</div>`; }
  if (w.loading) return `<div class="panel muted">กำลังโหลดพยากรณ์อากาศ…</div>`;
  if (w.err) return `<div class="notice bad">☁️<div style="flex:1">ดึงพยากรณ์อากาศไม่ได้: ${esc(w.err)}</div><button class="btn sm" data-act="wxRetry">ลองใหม่</button></div>`;
  const d = w.data, wd = ["อา","จ","อ","พ","พฤ","ศ","ส"];
  return `<div class="list">` + d.time.map((day,i) => {
    const code = d.weather_code[i], [ico,txt] = WMO[code] || ["🌡️","—"], rain = d.precipitation_probability_max[i] ?? 0;
    const warn = rain >= 60 || [95,96,99,82,65].includes(code), dt = new Date(day+"T00:00:00");
    return `<div class="wx ${warn?"warn":""}"><div class="wx-d">${i===0?"วันนี้":wd[dt.getDay()]}<div class="muted" style="font-size:11.5px;font-weight:500">${dt.getDate()}/${dt.getMonth()+1}</div></div><div class="wx-i">${ico}</div>
      <div style="flex:1;min-width:0"><div style="font-size:14.5px;font-weight:500">${txt}</div><div class="muted" style="font-size:12px">ฝน ${Math.round(rain)}% · ลม ${Math.round(d.wind_speed_10m_max[i])} กม./ชม. · ตก ${String(d.sunset[i]).slice(11,16)}</div></div>
      <div class="wx-t">${Math.round(d.temperature_2m_max[i])}°<small>/${Math.round(d.temperature_2m_min[i])}°</small></div></div>`;
  }).join("") + `</div><div class="hint">ข้อมูลจาก Open-Meteo · แถบสีเหลืองคือวันที่ฝนน่าจะตกหนัก</div>`;
}

/* ═══════════════ MANAGE ═══════════════ */
function vManage(c){
  const [t, bar] = seg("manage", ["ทริป","เพื่อน","ยอดรวม","ถังขยะ","สำรอง"], "sm");
  let h = `<h2 style="margin-top:6px">จัดการ</h2>` + bar;
  if (!c.me && t !== BACKUP_TAB) return h + emptyState("🔒","ต้องเข้าสู่ระบบก่อน","แท็บสำรองใช้ได้โดยไม่ต้องเข้าสู่ระบบ","เข้าสู่ระบบ",`data-act="menu" data-k="account"`);
  return h + [vEvents, vMembers, vCross, vTrash, vBackup][t](c);
}
function vEvents(c){
  let h = "";
  if (c.trip){
    const t = c.trip;
    h += `<div class="panel"><form data-form="editEv"><div class="fld"><span class="lbl">ชื่อทริป</span><input type="text" name="name" maxlength="${NAME_MAXLEN}" value="${esc(t.name)}"></div>
      <div class="fld"><span class="lbl">วันที่</span><input type="date" name="date" value="${esc(t.trip_date||todayStr())}"></div><button class="btn pri full" type="submit">บันทึก</button></form></div>`;
    const left = c.closed ? 0 : Object.values(computeNet(c.tid,c.members).net).filter(v => Math.abs(v) > 0.01).length;
    h += `<div class="list"><div class="it"><div class="g"><div class="t1">${c.closed?"🔒 ทริปปิดแล้ว":"ปิดทริป"}</div><div class="t2">${c.closed?`ปิดเมื่อ ${esc(t.closed_at||"-")}`:left?`ยังมี ${left} คนที่ยอดไม่เป็นศูนย์`:"ยอดเคลียร์ครบแล้ว พร้อมปิด"}</div></div>
      <button class="btn sm" data-act="${c.closed?"reopenTrip":"closeTrip"}">${c.closed?"เปิดอีกครั้ง":"ปิดทริป"}</button></div>
      <div class="it"><div class="g"><div class="t1">ลบทริป</div><div class="t2">${t.created_by===c.me?"ย้ายไปถังขยะ กู้คืนได้ภายหลัง":t.created_by?`ลบได้เฉพาะ ${esc(t.created_by)} ผู้สร้างทริป`:"ทริปนี้ยังไม่มีเจ้าของ"}</div></div>
      ${t.created_by===c.me?`<button class="btn sm danger" data-act="trashTrip">ลบ</button>`:t.created_by?"":`<button class="btn sm" data-act="claimTrip">รับเป็นเจ้าของ</button>`}</div></div>`;
  }
  if (!c.trip) UI.open.add("newtrip");
  h += more("newtrip", "➕ สร้างทริปใหม่", `<form class="panel" data-form="createEv">
    <div class="fld"><span class="lbl">ชื่อทริป</span><input type="text" name="name" maxlength="${NAME_MAXLEN}" placeholder="เช่น ทริปเชียงใหม่"></div>
    <div class="fld"><span class="lbl">วันที่</span><input type="date" name="date" value="${todayStr()}"></div>
    ${c.trips.length?`<div class="fld"><span class="lbl">คัดลอกจากทริปเดิม</span><select name="src"><option value="">ไม่คัดลอก เริ่มใหม่</option>${c.trips.map(t => opt(String(t.id),"",t.name)).join("")}</select>
    <label class="chk"><input type="checkbox" name="cpm" checked> คัดลอกรายชื่อเพื่อน</label><label class="chk"><input type="checkbox" name="cpp" checked> คัดลอกรายการของที่ต้องหิ้ว</label></div>`:""}
    <button class="btn pri full" type="submit">สร้างทริป</button></form>`);
  return h;
}
function vMembers(c){
  if (!c.trip) return emptyState("🗓️","ยังไม่ได้เลือกทริป","สร้างหรือเลือกทริปก่อน","ไปที่ทริป",`data-act="tab" data-k="manage" data-i="0"`);
  const avail = DB.all_users.map(u => u.name).filter(u => !c.members.includes(u));
  let h = `<h2 style="margin-top:4px">ในทริปนี้ <small>${c.members.length} คน</small></h2>`;
  h += c.members.length ? `<div class="list">${c.members.map(m => { const on = c.online.includes(m);
    return `<div class="it">${avatar(m,40,15)}<div class="g"><div class="t1">${esc(m)}${m===c.me?" (คุณ)":""}</div><div class="t2">${on?"🟢 ออนไลน์":"ออฟไลน์"}</div></div>${c.closed?"":`<button class="btn sm" data-act="rmMember" data-n="${esc(m)}">นำออก</button>`}</div>`; }).join("")}</div>`
    : `<div class="notice info">👥<div>ยังไม่มีใครในทริปนี้ เลือกเพื่อนด้านล่างได้เลย</div></div>`;
  if (c.closed) return h + lockedNotice(true);
  h += `<h2>เพิ่มเพื่อน</h2>`;
  if (avail.length) h += `<div class="panel"><div class="chips" style="margin-bottom:12px">${avail.map(u => `<label class="chip p"><input type="checkbox" class="addm" value="${esc(u)}">${avatar(u,28,11)} ${esc(u)}<span class="tick">✓</span></label>`).join("")}</div>
    <div class="btns"><button class="btn" style="flex:0 0 auto" data-act="selAllM">เลือกทุกคน</button><button class="btn pri" data-act="addMembers">เพิ่มเข้าทริป</button></div></div>`;
  h += `<div class="hint">เพื่อนที่ยังไม่มีบัญชี ให้สร้างบัญชีในเครื่องนี้ก่อน (ออกจากระบบ → สร้างบัญชีใหม่) แล้วจะขึ้นมาให้เลือก</div>`;
  return h;
}
function vCross(c){
  const use = DB.trips.filter(t => (t.status===0||t.status===2) && !(UI.crossOpen && t.status===2)).sort((a,b) => a.id-b.id);
  let h = `<label class="chk" style="margin-bottom:6px"><input type="checkbox" ${UI.crossOpen?"checked":""} data-change="crossOpen"> นับเฉพาะทริปที่ยังไม่ปิด</label>`;
  const total = {}, per = [];
  for (const t of use){ const mem = DB.members.filter(m => m.trip_id===t.id).map(m => m.name), r = computeNet(t.id, mem);
    if (!r.exps.length && !r.paid.length) continue; per.push([t, r.net]); for (const k in r.net) total[k] = (total[k]||0) + r.net[k]; }
  if (!Object.keys(total).length) return h + emptyState("🧮","ยังไม่มีบิลในทริปไหนเลย","พอเริ่มบันทึกบิล ยอดรวมข้ามทริปจะมาแสดงตรงนี้");
  const mine = total[c.me]||0, cls = mine<-0.01?"a-owe":mine>0.01?"a-get":"a-even";
  h += `<section class="pass"><div class="pass-top"><h1 class="pass-name">รวม ${per.length} ทริป</h1><div class="pass-meta"><span>หักกลบหนี้ทุกทริปแล้ว โอนครั้งเดียวจบ</span></div></div><div class="pass-cut"></div>
    <div class="pass-bot"><div><div class="pass-lbl">${mine<-0.01?"คุณต้องจ่ายรวม":mine>0.01?"คุณจะได้คืนรวม":"เคลียร์หมดทุกทริป"}</div><div class="pass-amt ${cls}">${fmt(Math.abs(mine))}<small>บาท</small></div></div></div></section>`;
  const plan = settlePlan(total);
  h += plan.length ? plan.map(([d,cr,a]) => `<div class="tx ${c.me===d||c.me===cr?"me":""}">${flowCard(d,cr,a,c.me,40)}</div>`).join("") : `<div class="clear"><div class="e">🎉</div><div class="t">เคลียร์ครบทุกคนทุกทริป</div></div>`;
  h += `<div class="hint">การกด “โอนแล้ว” ยังต้องทำในแต่ละทริป เพื่อให้ประวัติของทริปนั้นถูกต้อง</div>`;
  h += more("crossper", `ดูแยกรายทริป (${per.length})`, `<div class="list">${per.map(([t,n]) => { const v = n[c.me]||0;
    return `<div class="it"><div class="g"><div class="t1">${t.status===2?"🔒 ":""}${esc(t.name)}</div></div><div class="amt" style="color:${moneyCls(v)}">${v<-0.01?`−${fmt(-v)}`:v>0.01?`+${fmt(v)}`:"0.00"}</div></div>`; }).join("")}</div>`);
  return h;
}
function vTrash(c){
  const dels = DB.trips.filter(t => t.status === 1);
  if (!dels.length) return emptyState("🗑️","ถังขยะว่าง","ทริปที่ลบจะพักไว้ที่นี่ก่อน กู้คืนได้ตลอด");
  return `<div class="list">${dels.map(t => `<div class="it"><div class="g"><div class="t1">${esc(t.name)}</div><div class="t2">${t.created_by?`สร้างโดย ${esc(t.created_by)}`:"ไม่มีเจ้าของ กู้คืนแล้วรับเป็นเจ้าของก่อนจึงลบถาวรได้"}</div></div>
    <button class="btn sm" data-act="restoreTrip" data-id="${t.id}">กู้คืน</button>${t.created_by===c.me?`<button class="btn sm danger" data-act="purgeTrip" data-id="${t.id}">ลบถาวร</button>`:""}</div>`).join("")}</div>`;
}

    <h2>กู้คืนจากไฟล์</h2><div class="panel"><label class="drop" style="margin-bottom:12px"><span class="ph" data-ph>📄</span><span data-fn>เลือกไฟล์ .json (ใช้ไฟล์จากเวอร์ชัน Streamlit ได้)</span><input type="file" id="restoreFile" accept=".json,application/json" data-change="slipPick"></label>
    <div class="seg sm"><label><input type="radio" name="rmode" value="wipe" checked>แทนที่ทั้งหมด</label><label><input type="radio" name="rmode" value="merge">รวมกับของเดิม</label></div>
    <label class="chk"><input type="checkbox" id="restoreOk"> ฉันเข้าใจว่าข้อมูลปัจจุบันอาจถูกเขียนทับ</label>
    <button class="btn full" style="margin-top:10px" data-act="importBackup">กู้คืนข้อมูล</button></div>`;
}

/* ═══════════════ CHAT ═══════════════ */
function vChat(c){
  if (!c.trip) return emptyState("💬","ยังไม่ได้เลือกทริป","แชทแยกตามทริป เลือกทริปก่อนแล้วค่อยคุยกัน","เลือกทริป",`data-act="sheet" data-s="trips"`);
  const me = c.me, rows = DB.notifications.filter(n => n.trip_id===c.tid && (n.to_user===me || n.from_user===me)).sort((a,b) => (a.timestamp<b.timestamp?-1:a.timestamp>b.timestamp?1:a.id-b.id));
  const grps = {}, unrd = {};
  rows.forEach(n => { const pt = (n.is_auto || n.from_user==="ระบบสรุปยอด") ? "🤖 ระบบ" : (n.to_user===me ? n.from_user : n.to_user);
    (grps[pt] = grps[pt]||[]).push(n); unrd[pt] = (unrd[pt]||0) + (n.to_user===me && !n.is_read ? 1 : 0); });
  const pt = S.chat_partner, others = c.members.filter(m => m !== me);
  const sysAv = s => `<div class="av" style="width:${s}px;height:${s}px;background:var(--pine);font-size:${s*.45}px">🤖</div>`;
  if (pt && (grps[pt] || others.includes(pt))){
    if (unrd[pt]) { grps[pt].forEach(n => { if (n.to_user===me) n.is_read = 1; }); save(); }
    const msgs = grps[pt] || [], on = c.online.includes(pt);
    let h = `<div style="display:flex;align-items:center;gap:10px;margin:6px 0 12px"><button class="icon-btn" data-act="chatOpen" data-p="" aria-label="กลับ">${ic("back")}</button>${pt==="🤖 ระบบ"?sysAv(40):avatar(pt,40,15)}
      <div style="flex:1;min-width:0"><div style="font-family:var(--disp);font-weight:600;font-size:17px">${esc(pt==="🤖 ระบบ"?"แจ้งเตือนจากระบบ":pt)}</div><div class="muted" style="font-size:12.5px">${pt==="🤖 ระบบ"?"แจ้งเตือนบิลและการโอน":on?"🟢 ออนไลน์":"ออฟไลน์"}</div></div></div>
      <div class="thread" id="chatBody">${msgs.map(n => { const ts = String(n.timestamp||"").slice(11,16), mt = esc(n.message).replace(/\n/g,"<br>");
        if (n.is_auto || n.from_user==="ระบบสรุปยอด") return `<div><div class="b-sys">${mt}</div><div class="b-time">${ts}</div></div>`;
        if (n.from_user===me) return `<div style="display:flex;flex-direction:column;align-items:flex-end"><div class="b-out">${mt}</div><div class="b-time">${ts}</div></div>`;
        return `<div style="display:flex;flex-direction:column;align-items:flex-start"><div class="b-in">${mt}</div><div class="b-time">${ts}</div></div>`; }).join("") || `<div class="muted" style="text-align:center;margin:auto">เริ่มคุยกับ ${esc(pt)} ได้เลย</div>`}</div>`;
    if (pt !== "🤖 ระบบ") h += `<form data-form="reply" class="composer"><input type="text" id="replyBox" name="msg" placeholder="พิมพ์ข้อความ" autocomplete="off"><button class="btn" type="submit" name="like" value="1" aria-label="ถูกใจ">👍</button><button class="btn pri" type="submit" aria-label="ส่ง">${ic("send")}</button></form>`;
    if (msgs.length) h += `<div style="margin-top:14px">${more("delmsg","ลบข้อความ",`<div class="list">${msgs.map(n => `<div class="it"><div class="g"><div class="t2" style="white-space:normal">${esc(n.from_user)}: ${esc(n.message.length>50?n.message.slice(0,50)+"…":n.message)}</div></div><button class="btn sm danger" data-act="delMsg" data-id="${n.id}">ลบ</button></div>`).join("")}</div>`)}</div>`;
    return h;
  }
  let h = `<h2 style="margin-top:6px">แชท</h2>`;
  const keys = Object.keys(grps).sort((a,b) => { const la = grps[a][grps[a].length-1], lb = grps[b][grps[b].length-1]; return la.timestamp < lb.timestamp ? 1 : -1; });
  h += keys.length ? `<div class="list">${keys.map(p => { const last = grps[p][grps[p].length-1];
    return `<button class="it" data-act="chatOpen" data-p="${esc(p)}">${p==="🤖 ระบบ"?sysAv(44):avatar(p,44,16)}<div class="g"><div class="t1">${esc(p==="🤖 ระบบ"?"แจ้งเตือนจากระบบ":p)}</div><div class="t2">${esc(last.message.split("\n")[0])}</div></div>
      <div style="text-align:right"><div class="muted" style="font-size:11.5px">${esc(String(last.timestamp).slice(11,16))}</div>${unrd[p]?`<span class="dot" style="position:static;display:inline-grid;border:0">${unrd[p]}</span>`:""}</div></button>`; }).join("")}</div>`
    : emptyState("💬","ยังไม่มีข้อความ","แจ้งเตือนบิลใหม่และการโอนจะเข้ามาที่นี่ หรือเริ่มคุยกับเพื่อนด้านล่าง");
  if (others.length) h += `<h2>เริ่มคุยกับ</h2><div class="chips">${others.map(m => `<button class="chip p" data-act="chatOpen" data-p="${esc(m)}">${avatar(m,28,11)} ${esc(m)}</button>`).join("")}</div>`;
  return h;
}

/* ═══════════════ ACCOUNT / LOGIN ═══════════════ */

  let h = `<div class="wrap"><div class="login"><div class="brand"><div class="logo">⛺</div><div><h1>Trip Splitter</h1><div class="tag">หารค่าทริปกับเพื่อน ไม่ต้องจดใส่กระดาษ</div></div></div>`;

    h += `<form data-form="login"><span class="lbl">คุณคือใคร</span><div class="who">${users.map((u,i) => `<label><input type="radio" name="name" value="${esc(u.name)}" ${i===0?"checked":""}>${avatar(u.name,48,18)}${esc(u.name)}</label>`).join("")}</div>
      <div class="fld"><span class="lbl">PIN 4 หลัก</span><input class="pin" type="password" name="pin" maxlength="4" inputmode="numeric" autocomplete="current-password" placeholder="••••"></div>

    h += `<form data-form="signup" class="panel"><div class="fld"><span class="lbl">ชื่อเล่น</span><input type="text" name="name" maxlength="${NAME_MAXLEN}" placeholder="ชื่อที่เพื่อนเรียก" autocomplete="nickname"></div>
      <div class="fld"><span class="lbl">ตั้ง PIN 4 หลัก</span><input class="pin" type="password" name="p1" maxlength="4" inputmode="numeric" autocomplete="new-password" placeholder="••••"></div>
      <div class="fld"><span class="lbl">ยืนยัน PIN</span><input class="pin" type="password" name="p2" maxlength="4" inputmode="numeric" autocomplete="new-password" placeholder="••••"></div>

  return h + `<button class="btn ghost full" style="margin-top:4px;color:var(--ink3)" data-act="goto" data-menu="manage" data-tk="manage" data-ti="${BACKUP_TAB}">กู้คืนข้อมูลจากไฟล์สำรอง</button></div></div>`;

    <div class="two"><div class="fld"><span class="lbl">ธนาคาร</span><select name="bn">${BANK_LIST.map(b => opt(b, u.bank_name||BANK_LIST[0], b===BANK_LIST[0]?"ไม่ระบุ":b)).join("")}</select></div>
    <div class="fld"><span class="lbl">เลขบัญชี</span><input type="text" name="ba" inputmode="numeric" value="${esc(u.bank_account||"")}"></div></div>
    <button class="btn pri full" type="submit">บันทึกบัญชีรับเงิน</button><div class="hint">เพื่อนจะเห็น QR พร้อมเพย์พร้อมยอดเงินตอนต้องโอนให้คุณ</div></form>`;
  h += more("prof", "👤 แก้ไขชื่อและรูปโปรไฟล์", `<form class="panel" data-form="profile"><div class="fld"><span class="lbl">ชื่อที่แสดง</span><input type="text" name="name" maxlength="${NAME_MAXLEN}" value="${esc(c.me)}"><div class="hint">เปลี่ยนแล้ว บิล แชท และยอดเงินเดิมจะตามไปด้วย</div></div>
    <div class="fld"><label class="drop"><span class="ph" data-ph ${u.avatar_blob?`style="background-image:url(${u.avatar_blob});border-radius:50%"`:`style="border-radius:50%"`}>${u.avatar_blob?"":ic("image")}</span><span data-fn>แตะเพื่อเลือกรูปโปรไฟล์</span><input type="file" name="pic" accept="image/*" data-change="slipPick"></label></div>
    ${u.avatar_blob?`<label class="chk"><input type="checkbox" name="delpic"> ลบรูปโปรไฟล์</label>`:""}<button class="btn pri full" type="submit">บันทึกโปรไฟล์</button></form>`);
  h += more("pin", "🔑 เปลี่ยน PIN", `<form class="panel" data-form="chgPin">${u.pin_hash?`<div class="fld"><span class="lbl">PIN เดิม</span><input class="pin" type="password" name="op" maxlength="4" inputmode="numeric" placeholder="••••"></div>`:`<div class="hint">บัญชีนี้ยังไม่เคยตั้ง PIN</div>`}
    <div class="two"><div class="fld"><span class="lbl">PIN ใหม่</span><input class="pin" type="password" name="p1" maxlength="4" inputmode="numeric" placeholder="••••"></div><div class="fld"><span class="lbl">ยืนยัน PIN ใหม่</span><input class="pin" type="password" name="p2" maxlength="4" inputmode="numeric" placeholder="••••"></div></div>
    <button class="btn pri full" type="submit">เปลี่ยน PIN</button></form>`);
  h += `<h2>คนในเครื่องนี้ <small>${DB.all_users.length} คน</small></h2><div class="list">${DB.all_users.map(x => { const on = c.online.includes(x.name);
    return `<div class="it">${avatar(x.name,36,14,on?null:"var(--ink3)")}<div class="g"><div class="t1">${esc(x.name)}${x.name===c.me?" (คุณ)":""}</div><div class="t2">${on?"🟢 ออนไลน์":"ออฟไลน์"}</div></div></div>`; }).join("")}</div>`;
  return h + `<button class="btn danger full" data-act="logout">ออกจากระบบ</button>`;
}

/* ═══════════════ SHEETS ═══════════════ */
function vSheet(c){
  const s = UI.sheet; if (!s) return "";
  let inner = "";
  if (s.type === "add" || s.type === "edit"){
    const e = s.type === "edit" ? DB.expenses.find(x => x.id === s.id) : null;
    if ((s.type === "edit" && !e) || !c.trip){ UI.sheet = null; return ""; }
    inner = billForm(c, e);
  } else if (s.type === "trips"){
    inner = `<div class="sf"><div class="sheet-h"><h3>ทริปของคุณ</h3><button class="icon-btn" data-act="closeSheet" aria-label="ปิด">${ic("x")}</button></div><div class="sheet-b">
      ${c.trips.length ? `<div class="list" style="box-shadow:none;background:var(--surface2)">${c.trips.map(t => { const n = DB.members.filter(m => m.trip_id===t.id).length;
        return `<button class="it" data-act="selTrip" data-id="${t.id}"><div class="cat-ico" style="background:${t.id===c.tid?"var(--pine)":"var(--surface)"};color:${t.id===c.tid?"var(--on-pine)":"inherit"}">${t.status===2?"🔒":"⛺"}</div>
          <div class="g"><div class="t1">${esc(t.name)}</div><div class="t2">${t.trip_date?thDate(t.trip_date)+" · ":""}${n} คน</div></div>${t.id===c.tid?`<span style="color:var(--pine)">${ic("check")}</span>`:""}</button>`; }).join("")}</div>`
        : `<div class="muted" style="text-align:center;padding:20px">ยังไม่มีทริป</div>`}</div>
      <div class="sheet-f"><button class="btn pri full" data-act="newTrip">${ic("plus")} สร้างทริปใหม่</button></div></div>`;
  }
  return `<div class="sheet-bg" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true">${inner}</div>`;
}

/* ═══════════════ RENDER ═══════════════ */
const app = document.getElementById("app");
function render(){
  const c = ctx();
  let html;
  if (CLOUD_CONF && !READY && !DB.all_users.length){ html = loadingScreen(); UI.sheet = null; }
  else if (!c.me && S.menu !== "manage"){ html = vLogin(); UI.sheet = null; }
  else if (!c.me){ html = `<header class="top"><div class="wrap"><button class="icon-btn" data-act="menu" data-k="home" aria-label="กลับ">${ic("back")}</button><span style="font-family:var(--disp);font-weight:600;font-size:17px">กลับไปหน้าเข้าสู่ระบบ</span></div></header><main class="wrap">${vManage(c)}</main>`; }
  else {
    const body = ({home:vHome, bills:vBills, chat:vChat, manage:vManage, account:vAccount}[S.menu] || vHome)(c);
    html = vTop(ctx()) + `<main class="wrap">${syncBanner()}${body}</main>` + vNav(ctx()) + vSheet(c);
  }
  const a = document.activeElement, fid = a && a.id; let s0, s1; try { s0 = a.selectionStart; s1 = a.selectionEnd; } catch(e){}
  const y = window.scrollY, hadSheet = !!document.querySelector(".sheet");
  app.innerHTML = html;
  window.scrollTo(0, y);
  document.body.classList.toggle("lock", !!UI.sheet);
  if (fid){ const n = document.getElementById(fid); if (n){ n.focus(); try { n.setSelectionRange(s0, s1); } catch(e){} } }
  const sh = document.querySelector(".sheet");
  if (sh){
    if (hadSheet) sh.style.animation = "none", document.querySelector(".sheet-bg").style.animation = "none";
    const f = sh.querySelector("form[data-form=saveBill]"); if (f) updatePreview(f);
    if (!hadSheet){ const af = sh.querySelector("[autofocus]"); if (af && matchMedia("(hover:hover)").matches) af.focus(); }
  }
  const cb = document.getElementById("chatBody"); if (cb) cb.scrollTop = cb.scrollHeight;
  if (typeof syncPresence === "function") syncPresence();
}

/* ═══════════════ ACTIONS ═══════════════ */
const num = v => Number(v);
const ACT = {
  menu: el => { S.menu = el.dataset.k; UI.sheet = null; if (S.menu !== "chat") S.chat_partner = S.chat_partner; window.scrollTo(0,0); },
  tab: el => { S.tabs[el.dataset.k] = num(el.dataset.i); UI.sheet = null; },
  goto: el => { S.menu = el.dataset.menu; S.tabs[el.dataset.tk] = num(el.dataset.ti); UI.sheet = null; window.scrollTo(0,0); },
  selTrip: el => { S.trip_id = num(el.dataset.id); UI.sheet = null; S.chat_partner = null; },
  newTrip: () => { UI.sheet = null; S.menu = "manage"; S.tabs.manage = 0; UI.open.add("newtrip"); window.scrollTo(0,0); },
  sheet: el => { UI.sheet = {type: el.dataset.s, id: el.dataset.id ? num(el.dataset.id) : null}; },
  addBill: () => { const c = ctx(); if (!c.trip || c.closed) return "skip";
    if (!c.members.length){ flash("เพิ่มเพื่อนเข้าทริปก่อน แล้วค่อยบันทึกบิล","info"); S.menu = "manage"; S.tabs.manage = 1; return; }
    UI.sheet = {type:"add"}; },
  closeSheet: () => { UI.sheet = null; },
  chatOpen: el => { S.chat_partner = el.dataset.p || null; window.scrollTo(0,0); },
  loginMode: el => { UI.loginMode = el.dataset.v; },
  billCat: el => { UI.cat = el.dataset.v; },
  splitAll: el => { const f = el.closest("form"); f.querySelectorAll("input[name=sp]").forEach(x => x.checked = true); updatePreview(f); return "skip"; },
  selAllM: () => { const all = [...document.querySelectorAll(".addm")], on = !all.every(x => x.checked); all.forEach(x => x.checked = on); return "skip"; },
  zoom: el => { const r = DB[el.dataset.t].find(x => x.id === num(el.dataset.id)); const src = r && (r.image_blob || r.slip_blob); if (!src) return "skip";
    const lb = document.createElement("div"); lb.className = "lightbox"; lb.innerHTML = `<img src="${src}" alt="รูปสลิป">`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); return "skip"; },
  copy: el => { const v = el.dataset.v; const fb = () => { const t = document.createElement("textarea"); t.value = v; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); flash("คัดลอกแล้ว","info"); } catch(e){} t.remove(); };
    if (navigator.clipboard) navigator.clipboard.writeText(v).then(() => flash("คัดลอกแล้ว","info"), fb); else fb(); return "skip"; },
  delBill: el => { if (!confirm("ลบบิลนี้?")) return "skip"; const id = num(el.dataset.id); DB.expenses = DB.expenses.filter(e => e.id !== id); DB.packing.forEach(p => { if (p.expense_id === id) p.expense_id = null; }); UI.sheet = null; return ["ลบบิลแล้ว","warn"]; },
  dlQR: el => { const p = ppPayload(el.dataset.pp, num(el.dataset.amt)); if (p) download(`promptpay_${el.dataset.cn}_${num(el.dataset.amt).toFixed(2)}.png`, qrCanvas(p,10,3).toDataURL("image/png")); return "skip"; },
  pay: async el => {
    const c = ctx(), {dn, cn} = el.dataset, at = num(el.dataset.amt), f = document.getElementById("paySlip_"+el.dataset.i);
    let slip = null; try { slip = await readImage(f && f.files[0]); } catch(e){ flash(e.message,"err"); return "skip"; }
    DB.settlements.push({id:nextId("settlements"), trip_id:c.tid, debtor:dn, creditor:cn, amount:r2(at), timestamp:nowStr(), slip_blob:slip});
    notify(c.tid, c.me===dn ? cn : dn, `✅ บันทึกการโอนเงิน\n💳 ${dn} → ${cn}\n💰 ${fmt(at)} บาท` + (slip ? "\n📎 แนบสลิปไว้แล้ว" : ""));
    return [`บันทึกว่า ${dn} โอนให้ ${cn} แล้ว`];
  },
  nudge: el => { const c = ctx(), {dn, cn} = el.dataset, at = num(el.dataset.amt), u = userBy(cn)||{};
    let m = `🔔 แจ้งเตือนยอดค้าง\n💳 ${dn} → ${cn}\n💰 ${fmt(at)} บาท`; if (u.promptpay) m += `\n📱 พร้อมเพย์: ${u.promptpay}`; if (u.bank_account) m += `\n🏦 ${u.bank_name||"บัญชี"}: ${u.bank_account}`; m += "\n(ดู QR พร้อมยอดได้ที่ ทริป → โอนเงิน)";
    notify(c.tid, dn, m, c.me, 0); return [`ส่งข้อความทวงถึง ${dn} แล้ว`]; },
  unpay: el => { if (!confirm("ยกเลิกรายการโอนนี้?")) return "skip"; DB.settlements = DB.settlements.filter(s => s.id !== num(el.dataset.id)); return ["ยกเลิกรายการโอนแล้ว"]; },
  packDel: el => { DB.packing = DB.packing.filter(p => p.id !== num(el.dataset.id)); return ["ลบรายการแล้ว","warn"]; },
  clearCamp: () => { Object.assign(ctx().trip, {place_name:null, lat:null, lon:null}); return ["ล้างจุดกางเต็นท์แล้ว","warn"]; },
  wxRetry: () => { Object.keys(WX).forEach(k => delete WX[k]); },
  dlOffline: () => { offlineSheet(ctx()); return "skip"; },
  closeTrip: () => { Object.assign(ctx().trip, {status:2, closed_at:nowStr()}); return ["ปิดทริปแล้ว ดูย้อนหลังได้อย่างเดียว"]; },
  reopenTrip: () => { Object.assign(ctx().trip, {status:0, closed_at:null}); return ["เปิดทริปอีกครั้งแล้ว"]; },
  trashTrip: () => { if (!confirm("ย้ายทริปนี้ไปถังขยะ?")) return "skip"; ctx().trip.status = 1; S.trip_id = null; return ["ย้ายไปถังขยะแล้ว"]; },
  claimTrip: () => { const t = ctx().trip; if (!t.created_by) t.created_by = S.me; return ["คุณเป็นเจ้าของทริปนี้แล้ว"]; },
  restoreTrip: el => { DB.trips.find(t => t.id === num(el.dataset.id)).status = 0; return ["กู้คืนทริปแล้ว"]; },

/* ═══════════════ CLOUD SYNC (Supabase) ═══════════════
   แนวคิด: ตัวแอปยังทำงานกับ DB ในหน่วยความจำเหมือนเดิมทุกอย่าง
   ทุกครั้งที่ save() ระบบจะเทียบกับสิ่งที่ซิงก์ล่าสุด (SYNCED) แล้วส่งเฉพาะแถวที่เปลี่ยนขึ้นคลาวด์
   และรับการเปลี่ยนแปลงจากเครื่องเพื่อนผ่าน Realtime มาใส่ DB แล้ววาดหน้าใหม่
   แถวที่ยังส่งไม่สำเร็จ (เช่นตอนไม่มีเน็ต) จะจำไว้ใน PENDING และส่งซ้ำเองเมื่อกลับมาออนไลน์ */
const CLOUD_CONF = !!(SUPABASE_URL && SUPABASE_KEY);
const PKEY = "tripSplitter.pending.v1", INITKEY = "tripSplitter.cloudInit.v1", LOCALBAK = "tripSplitter.db.localBackup.v1";
const SYNC_TABLES = TABLES.filter(t => t !== "online_status");
let SB = null, READY = false, SYNC_STATE = CLOUD_CONF ? "connecting" : "local", NEED_RENDER = false, PUSHING = false, RETRY_T = null;
const SYNCED = new Map();                 // "tbl|id" -> JSON ของแถวตามที่อยู่บนคลาวด์
const PENDING = new Set((() => { try { return JSON.parse(lsGet(PKEY)) || []; } catch(e){ return []; } })());
let ONLINE = new Set(), PRESENCE = null, TRACKED = undefined;
const rkey = (t, id) => `${t}|${id}`;
const persistPending = () => lsSet(PKEY, JSON.stringify([...PENDING]));

function nextId(t){
  // id จากเวลา + สุ่ม เพื่อไม่ให้เครื่องสองเครื่องสร้าง id ชนกัน
  let id = Date.now()*1000 + Math.floor(Math.random()*1000);
  while (DB[t].some(r => r.id === id)) id++;
  return id;
}
function save(){
  const cached = lsSet(KEY, JSON.stringify(DB));
  if (CLOUD_CONF){ markDirty(); return true; }
  if (!cached) { flash("พื้นที่เก็บข้อมูลของเบราว์เซอร์เต็ม — สำรองข้อมูลแล้วลบรูปสลิปเก่าบางส่วน", "err"); return false; }
  return true;
}
function markDirty(){
  const seen = new Set();
  for (const t of SYNC_TABLES) for (const r of DB[t]){ const k = rkey(t, r.id); seen.add(k); if (SYNCED.get(k) !== JSON.stringify(r)) PENDING.add(k); }
  for (const k of SYNCED.keys()) if (!seen.has(k)) PENDING.add(k);
  persistPending(); pushPending();
}
function findRow(k){ const i = k.indexOf("|"), t = k.slice(0,i), id = Number(k.slice(i+1)); return [t, id, (DB[t]||[]).find(r => r.id === id)]; }
function setSync(st){ if (SYNC_STATE === st) return; const was = SYNC_STATE; SYNC_STATE = st;
  if (st === "offline" && was === "ok") flash("ไม่มีอินเทอร์เน็ต — บันทึกไว้ในเครื่องก่อน จะส่งให้เพื่อนเมื่อกลับมาออนไลน์","warn");
  if (st === "ok" && was === "offline") flash("กลับมาออนไลน์แล้ว ซิงก์ข้อมูลเรียบร้อย","ok");
  remoteRender(); }
function retryLater(fn, ms=8000){ clearTimeout(RETRY_T); RETRY_T = setTimeout(fn, ms); }

async function pushPending(){
  if (!CLOUD_CONF || !READY || !SB || PUSHING || !PENDING.size) return;
  PUSHING = true;
  const keys = [...PENDING], sent = new Map(), ups = [], dels = {};
  for (const k of keys){ const [t, id, row] = findRow(k);
    if (row){ const j = JSON.stringify(row); sent.set(k, j); ups.push({tbl:t, id, data:row, _len:j.length}); }
    else { sent.set(k, null); (dels[t] = dels[t] || []).push(id); } }
  try {
    // แบ่งเป็นก้อน ไม่ให้ request เดียวใหญ่เกินไป (รูปสลิปเก็บเป็นข้อความ)
    let chunk = [], size = 0;
    const flush = async () => { if (!chunk.length) return; const { error } = await SB.from("rows").upsert(chunk, {onConflict:"tbl,id"}); if (error) throw error; chunk = []; size = 0; };
    for (const u of ups){ if (size + u._len > 1500000) await flush(); const { _len, ...rec } = u; chunk.push(rec); size += _len; }
    await flush();
    for (const t in dels) for (let i = 0; i < dels[t].length; i += 200){ const { error } = await SB.from("rows").delete().eq("tbl", t).in("id", dels[t].slice(i, i+200)); if (error) throw error; }
    for (const [k, j] of sent){
      if (j === null) SYNCED.delete(k); else SYNCED.set(k, j);
      const [, , row] = findRow(k), now = row ? JSON.stringify(row) : null;
      if (now === j) PENDING.delete(k);      // ถ้าแก้ซ้ำระหว่างส่ง ให้ค้างไว้ส่งรอบหน้า
    }
    persistPending(); PUSHING = false; setSync("ok");
    if (PENDING.size) setTimeout(pushPending, 50);
  } catch(e){
    console.warn("push failed", e); PUSHING = false;
    setSync(isNetErr(e) ? "offline" : "error"); retryLater(pushPending);
  }
}
const isNetErr = e => !navigator.onLine || /fetch|network|Failed|timeout/i.test(String(e && (e.message || e)));

async function fetchAll(){
  const all = []; let from = 0;
  for (;;){
    const { data, error } = await SB.from("rows").select("tbl,id,data").order("id").range(from, from + 999);
    if (error) throw error;
    all.push(...data); if (data.length < 1000) break; from += 1000;
  }
  return all;
}
async function pull(){
  try {
    const rows = await fetchAll(), nd = blank(), cloud = new Map();
    for (const r of rows){ if (!SYNC_TABLES.includes(r.tbl)) continue; const k = rkey(r.tbl, r.id); cloud.set(k, r.data); if (!PENDING.has(k)) nd[r.tbl].push(r.data); }
    for (const k of PENDING){ const [t, , row] = findRow(k); if (row) nd[t].push(row); }   // ของที่ยังไม่ได้ส่ง ใช้ของในเครื่อง
    SYNC_TABLES.forEach(t => nd[t].sort((a,b) => a.id - b.id));
    SYNCED.clear(); for (const [k, d] of cloud) SYNCED.set(k, JSON.stringify(d));
    DB = nd; lsSet(KEY, JSON.stringify(DB)); READY = true; setSync("ok");
    pushPending(); remoteRender(true);
  } catch(e){
    console.warn("pull failed", e); setSync(isNetErr(e) ? "offline" : "error"); remoteRender(true); retryLater(pull);
  }
}
function applyRemote(p){
  const rec = p.eventType === "DELETE" ? p.old : p.new; if (!rec || !SYNC_TABLES.includes(rec.tbl)) return;
  const k = rkey(rec.tbl, rec.id); if (PENDING.has(k)) return;          // เรากำลังจะเขียนทับอยู่แล้ว
  const arr = DB[rec.tbl], i = arr.findIndex(r => r.id === rec.id);
  if (p.eventType === "DELETE"){ if (i >= 0) arr.splice(i, 1); SYNCED.delete(k); }
  else { const j = JSON.stringify(rec.data); if (SYNCED.get(k) === j && i >= 0) return; SYNCED.set(k, j);
    if (i >= 0) arr[i] = rec.data; else { arr.push(rec.data); arr.sort((a,b) => a.id - b.id); } }
  clearTimeout(applyRemote._t); applyRemote._t = setTimeout(() => lsSet(KEY, JSON.stringify(DB)), 400);
  remoteRender();
}
function typingNow(){ const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && !["checkbox","radio","file"].includes(a.type); }
function remoteRender(force){
  if (!force && (UI.sheet || typingNow() || [...document.querySelectorAll("input[type=file]")].some(x => x.files.length) || document.querySelector(".lightbox"))){ NEED_RENDER = true; return; }
  NEED_RENDER = false; render();
}
document.addEventListener("focusout", () => setTimeout(() => { if (NEED_RENDER && !typingNow() && !UI.sheet) remoteRender(); }, 150));

/* ── ใครออนไลน์อยู่ (Realtime Presence) ── */
function onlineNow(){
  if (!CLOUD_CONF){ const m = onlineMap(), t = Date.now(); return Object.keys(m).filter(n => t - m[n] < 60000 && userBy(n)); }
  return [...ONLINE].filter(n => userBy(n));
}
function syncPresence(){
  if (!PRESENCE || TRACKED === S.me) return;
  TRACKED = S.me;
  if (S.me) PRESENCE.track({name:S.me, at:Date.now()}); else PRESENCE.untrack();
}

function initClient(){
  if (SB || !window.supabase) return !!SB;
  SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:false, autoRefreshToken:false}, realtime:{params:{eventsPerSecond:20}}});
  let wasDown = false;
  SB.channel("rows-changes").on("postgres_changes", {event:"*", schema:"public", table:"rows"}, applyRemote)
    .subscribe(st => {
      if (st === "SUBSCRIBED"){ if (wasDown){ wasDown = false; pull(); } }
      else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT" || st === "CLOSED"){ wasDown = true; }
    });
  let dev = lsGet("tripSplitter.device"); if (!dev){ dev = Math.random().toString(36).slice(2); lsSet("tripSplitter.device", dev); }
  PRESENCE = SB.channel("online-users", {config:{presence:{key:dev}}});
  PRESENCE.on("presence", {event:"sync"}, () => {
    const st = PRESENCE.presenceState(), names = new Set();
    Object.values(st).forEach(list => list.forEach(p => p.name && names.add(p.name)));
    const changed = names.size !== ONLINE.size || [...names].some(n => !ONLINE.has(n));
    ONLINE = names; if (changed) remoteRender();
  }).subscribe(st => { if (st === "SUBSCRIBED"){ TRACKED = undefined; syncPresence(); } });
  return true;
}

function boot(){
  if (!CLOUD_CONF){ heartbeat(); setInterval(heartbeat, 20000); render(); return; }
  // ครั้งแรกที่เครื่องนี้เชื่อมคลาวด์: เก็บข้อมูลเดิมในเครื่องแยกไว้ (นำขึ้นคลาวด์ได้จากหน้าสำรอง) แล้วเริ่มจากข้อมูลบนคลาวด์
  if (!lsGet(INITKEY)){
    if (TABLES.some(t => t !== "online_status" && DB[t].length)) lsSet(LOCALBAK, JSON.stringify(DB));
    DB = blank(); PENDING.clear(); persistPending(); lsSet(KEY, JSON.stringify(DB)); lsSet(INITKEY, "1");
  }
  // ระหว่างรอโหลด ใช้ข้อมูลที่จำไว้ในเครื่องไปก่อน (ถือว่าตรงกับคลาวด์ ยกเว้นแถวที่ยังค้างส่ง)
  for (const t of SYNC_TABLES) for (const r of DB[t]){ const k = rkey(t, r.id); if (!PENDING.has(k)) SYNCED.set(k, JSON.stringify(r)); }
  render();
  const start = () => { if (initClient()) pull(); else { setSync("offline"); retryLater(start); } };
  start();
  window.addEventListener("online", () => { if (!SB) start(); else if (!READY) pull(); else pushPending(); });
  window.addEventListener("offline", () => setSync("offline"));
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && SB && READY) pull(); });
}

/* ── ส่วนที่แสดงบนหน้าจอ ── */
function syncBanner(){
  if (!CLOUD_CONF) return "";
  if (SYNC_STATE === "offline") return `<div class="notice">📶<div>ออฟไลน์อยู่ ${PENDING.size?`มี ${PENDING.size} รายการรอส่ง `:""}จะซิงก์กับเพื่อนให้เองเมื่อกลับมาออนไลน์</div></div>`;
  if (SYNC_STATE === "error") return `<div class="notice bad">⚠️<div>เชื่อมต่อฐานข้อมูลไม่สำเร็จ ตรวจสอบการตั้งค่า Supabase (ตาราง rows และสิทธิ์การเข้าถึง) ${PENDING.size?`· ค้างส่ง ${PENDING.size} รายการ`:""}</div><button class="btn sm" data-act="syncRetry">ลองใหม่</button></div>`;
  return "";
}
function loadingScreen(){
  return `<div class="wrap"><div class="login" style="align-items:center;text-align:center"><div class="brand" style="justify-content:center"><div class="logo">⛺</div></div>
    <div style="font-family:var(--disp);font-weight:600;font-size:18px">${SYNC_STATE==="error"?"เชื่อมต่อฐานข้อมูลไม่สำเร็จ":SYNC_STATE==="offline"?"ไม่มีอินเทอร์เน็ต":"กำลังโหลดข้อมูลของกลุ่ม…"}</div>
    <div class="muted" style="font-size:14px;margin-top:4px">${SYNC_STATE==="error"?"ตรวจสอบว่าสร้างตาราง rows ตามคู่มือแล้ว และใส่ URL กับ key ถูกต้อง":SYNC_STATE==="offline"?"ต่อเน็ตแล้วแอปจะโหลดต่อเอง":"รอสักครู่"}</div>
    ${SYNC_STATE==="error"||SYNC_STATE==="offline"?`<button class="btn pri" style="margin-top:16px" data-act="syncRetry">ลองใหม่</button>`:""}</div></div>`;
}
function cloudBackupExtra(){
  if (!CLOUD_CONF) return "";
  let h = `<div class="notice info">☁️<div><b>ข้อมูลซิงก์กับเพื่อนทุกคนผ่านคลาวด์แล้ว</b> การกู้คืนแบบ “แทนที่ทั้งหมด” จะเปลี่ยนข้อมูลของทุกคนในกลุ่ม</div></div>`;
  if (lsGet(LOCALBAK)) h += `<div class="panel"><div style="font-weight:600;margin-bottom:4px">พบข้อมูลเดิมที่เคยใช้ในเครื่องนี้</div><div class="hint" style="margin-top:0">ข้อมูลก่อนเปลี่ยนมาใช้คลาวด์ ทำครั้งเดียวจากเครื่องหลักเครื่องเดียวพอ</div>
    <div class="btns"><button class="btn pri" data-act="migrateLocal">นำขึ้นคลาวด์</button><button class="btn" style="flex:0 0 auto" data-act="dlLocalBak">${ic("dl")} เก็บเป็นไฟล์</button><button class="btn danger" style="flex:0 0 auto" data-act="dropLocalBak">ทิ้ง</button></div></div>`;
  return h;
}
Object.assign(ACT, {
  syncRetry: () => { if (!SB) initClient(); READY ? pushPending() : pull(); setSync("connecting"); },
  migrateLocal: () => { if (!confirm("รวมข้อมูลเดิมในเครื่องนี้เข้ากับข้อมูลบนคลาวด์?")) return "skip";
    const raw = lsGet(LOCALBAK); const d = JSON.parse(raw), out = {data:{}};
    SYNC_TABLES.forEach(t => out.data[t] = d[t] || []);
    const [ok, msg] = importBackup(JSON.stringify(out), false);
    if (ok) localStorage.removeItem(LOCALBAK); flash(ok ? "นำข้อมูลเดิมขึ้นคลาวด์แล้ว" : msg, ok ? "ok" : "err"); },
  dlLocalBak: () => { const d = JSON.parse(lsGet(LOCALBAK)), out = {exported_at:nowStr(), version:1, data:{}};
    SYNC_TABLES.forEach(t => out.data[t] = (d[t]||[]).map(r => { const x = {...r}; (BLOB_COLS[t]||[]).forEach(k => x[k] = toB64(x[k])); return x; }));
    const url = URL.createObjectURL(new Blob([JSON.stringify(out)], {type:"application/json"})); download("trip_backup_local.json", url); setTimeout(() => URL.revokeObjectURL(url), 5000); return "skip"; },
  dropLocalBak: () => { if (!confirm("ทิ้งข้อมูลเดิมในเครื่องนี้? กู้คืนไม่ได้")) return "skip"; localStorage.removeItem(LOCALBAK); },
});

boot();
</script>
